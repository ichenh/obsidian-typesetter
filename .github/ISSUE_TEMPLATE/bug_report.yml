name: Bug report
description: Report a reproducible Typesetter problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove private vault content, credentials, and unrelated personal information before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced the problem with the latest Typesetter release.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability. Security reports must follow SECURITY.md.
          required: true
  - type: input
    id: plugin-version
    attributes:
      label: Typesetter version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: 1.x.x
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS/iPadOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Rendering surface
      options:
        - Source Mode
        - Live Preview
        - Reading View
        - Print/PDF output
        - Third-party export plugin
        - Multiple surfaces
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal source and reproduction steps
      description: Remove private information. Include the literal Markdown and the rendered result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings and other plugins
      description: State which rule switches are enabled and whether the issue persists with other plugins disabled.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or exporter details
      description: Include only information needed to diagnose the problem. Name the export plugin and version when relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Source safety
      options:
        - label: I confirmed whether the underlying Markdown source changed.
          required: true
