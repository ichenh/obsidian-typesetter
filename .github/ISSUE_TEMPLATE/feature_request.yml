name: Feature request
description: Propose a focused typography or integration improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for a similar proposal.
          required: true
        - label: The request preserves Typesetter's non-destructive rendering model.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Publishing problem
      description: Describe the prose convention or workflow that is currently unsupported.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should behave from the user's perspective and which surfaces need it.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Source and expected rendering examples
      description: Include ambiguous cases that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note relevant Obsidian features, input-method settings, CSS snippets, or plugins you have tried.
  - type: textarea
    id: safety
    attributes:
      label: Protected-context and compatibility considerations
      description: Explain possible conflicts with code, math, Markdown syntax, URLs, or mixed-language prose.
    validations:
      required: true
